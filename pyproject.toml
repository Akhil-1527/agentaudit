[project]
name = "agentaudit"
version = "0.1.0"
description = "AgentAudit is an autonomous multi-agent system that red-teams other AI agents and MCP servers for security vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "fastmcp>=2.0.0",
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
agentaudit = "agentaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentaudit", "target_agent"]
